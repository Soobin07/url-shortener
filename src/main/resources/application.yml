spring:
  application:
    name: url-shortener

  config:
    import: optional:application-local.yml

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

app:
  base-url: http://localhost:8080

  scheduler:
    zone: Asia/Tokyo
    expired-url-cleanup-cron: "0 0 3 * * *"